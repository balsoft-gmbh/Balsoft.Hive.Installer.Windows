name: release

# Packages are built, tested and author-signed (Balsoft GmbH code signing certificate, key in
# a hardware-backed KMS) by eng/release.ps1 on the maintainer's signing host, which attaches
# them to a GitHub release. This workflow publishes exactly those signed files to nuget.org
# with trusted publishing: no API key is stored anywhere.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download the signed packages attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" --pattern "*.nupkg" --pattern "*.snupkg" --dir packages
          ls -l packages

      - name: Verify the author signatures
        run: |
          for p in packages/*.nupkg; do
            dotnet nuget verify --all "$p"
          done

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ertugrulbalveren

      - name: Push to nuget.org
        run: |
          dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
